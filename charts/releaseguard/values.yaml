replicaCount: 2
image:
  repository: releaseguard
  tag: local
  pullPolicy: IfNotPresent
app:
  version: local
  fault: none
  secretName: releaseguard-secrets
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '1', memory: 384Mi}
service:
  port: 3000
ingress:
  enabled: false
  className: nginx
  host: releaseguard.example.test
  tlsSecret: ''
lab:
  enabled: false
  storageSize: 1Gi
networkPolicy:
  enabled: true
# Canary delivery with Argo Rollouts + Istio. Disabled: a plain Deployment with Helm rollback.
progressiveDelivery:
  enabled: false
  monitoringNamespace: monitoring
  # Canary traffic weight (percent) per step; each step is followed by a Prometheus analysis.
  canarySteps: [10, 30, 60]
  abortScaleDownDelaySeconds: 30
  analysis:
    prometheusAddress: http://prometheus.monitoring.svc.cluster.local:9090
    window: 1m
    initialDelay: 30s
    interval: 20s
    count: 4
    failureLimit: 1
    consecutiveErrorLimit: 2
    minRequests: 40
    maxErrorRatio: 0.02
    maxErrorRatioDeltaVsStable: 0.01
    maxP95LatencyMs: 400
    maxP95LatencyDeltaVsStableMs: 200
