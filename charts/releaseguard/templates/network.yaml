{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-private
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{port: {{ .Values.service.port }}, protocol: TCP}]
{{- if .Values.progressiveDelivery.enabled }}
    # Ambient: ztunnel and the waypoint deliver mesh traffic as HBONE on 15008.
    - from:
        - podSelector: {}
      ports: [{port: 15008, protocol: TCP}]
    # Ambient SNATs kubelet probes to this link-local address.
    - from:
        - ipBlock: {cidr: 169.254.7.127/32}
    # Prometheus scrapes application metrics directly (no sidecar metrics merging in ambient).
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.progressiveDelivery.monitoringNamespace }}}
      ports: [{port: {{ .Values.service.port }}, protocol: TCP}]
{{- end }}
{{- if .Values.lab.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dependencies
spec:
  podSelector:
    matchLabels: {releaseguard/dependency: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: {{ .Release.Name }}}}
        - podSelector: {matchLabels: {releaseguard/dependency: {{ .Release.Name }}}}
        # One-off clients such as a candidate migration Job (outside the API Service selector).
        - podSelector: {matchLabels: {releaseguard/client: {{ .Release.Name }}}}
{{- end }}
{{- end }}
