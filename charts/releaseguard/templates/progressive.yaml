{{- if .Values.progressiveDelivery.enabled }}
{{- $pd := .Values.progressiveDelivery }}
{{- $a := $pd.analysis }}
{{- $canary := printf "reporter=\"%s\",destination_service_namespace=\"%s\",destination_service_name=\"%s-canary\"" $a.reporter .Release.Namespace .Release.Name }}
{{- $stable := printf "reporter=\"%s\",destination_service_namespace=\"%s\",destination_service_name=\"%s-stable\"" $a.reporter .Release.Namespace .Release.Name }}
{{- $w := $a.window }}
# Argo Rollouts canary over Istio ambient: the Gateway API traffic-router plugin sets the
# backend weights of the HTTPRoute below; the waypoint enforces them for every caller of the
# releaseguard Service. Helm creates the objects; Argo Rollouts owns weights and selectors.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  minReadySeconds: 5
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  # Failed AnalysisRuns stay in the namespace as the in-cluster record of why a canary was aborted.
  analysis:
    successfulRunHistoryLimit: 5
    unsuccessfulRunHistoryLimit: 10
  template:
    {{- include "releaseguard.podTemplate" . | nindent 4 }}
  strategy:
    canary:
      stableService: {{ .Release.Name }}-stable
      canaryService: {{ .Release.Name }}-canary
      abortScaleDownDelaySeconds: {{ $pd.abortScaleDownDelaySeconds }}
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: {{ .Release.Name }}
            namespace: {{ .Release.Namespace }}
      steps:
        {{- range $pd.canarySteps }}
        - setWeight: {{ . }}
        - analysis:
            templates: [{templateName: {{ $.Release.Name }}-canary-health}]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-stable
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-canary
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
---
# Waypoint (Envoy) for the releaseguard Service; the Service opts in with istio.io/use-waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-waypoint
  labels: {istio.io/waypoint-for: service}
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - {name: mesh, port: 15008, protocol: HBONE}
---
# Traffic split for in-mesh callers of the releaseguard Service (GAMMA: parentRef is the Service).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - {group: '', kind: Service, name: {{ .Release.Name }}, port: {{ .Values.service.port }}}
  rules:
    - backendRefs:
        - {name: {{ .Release.Name }}-stable, port: {{ .Values.service.port }}, weight: 100}
        - {name: {{ .Release.Name }}-canary, port: {{ .Values.service.port }}, weight: 0}
{{- if $pd.ingressGateway.enabled }}
---
# Second entry point: an Istio ingress gateway. It forwards to the releaseguard Service, and
# istio.io/ingress-use-waypoint on that Service sends the traffic through the same waypoint and
# the same HTTPRoute split as in-mesh calls.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-ingress
  annotations: {networking.istio.io/service-type: ClusterIP}
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  parentRefs:
    - {name: {{ .Release.Name }}-ingress}
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/}}]
      backendRefs:
        - {name: {{ .Release.Name }}, port: {{ .Values.service.port }}}
{{- end }}
---
# Every metric uses the waypoint's L7 telemetry (istio_requests_total, istio_request_duration_milliseconds;
# reporter="waypoint") for the canary backend Service and, where stated, the stable one, over the same window.
# scripts/scenarios/ambient_metrics.mjs verifies these labels on the running stand before the drills.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-canary-health
spec:
  metrics:
    - name: canary-request-volume
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      consecutiveErrorLimit: {{ $a.consecutiveErrorLimit }}
      successCondition: result[0] >= {{ $a.minRequests }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: sum(increase(istio_requests_total{ {{- $canary -}} }[{{ $w }}])) or vector(0)
    - name: canary-error-ratio
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      consecutiveErrorLimit: {{ $a.consecutiveErrorLimit }}
      successCondition: result[0] <= {{ $a.maxErrorRatio }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: >-
            (sum(rate(istio_requests_total{ {{- $canary -}} ,response_code=~"5.."}[{{ $w }}])) or vector(0))
            / clamp_min(sum(rate(istio_requests_total{ {{- $canary -}} }[{{ $w }}])) or vector(0), 1e-9)
    - name: canary-error-ratio-vs-stable
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      consecutiveErrorLimit: {{ $a.consecutiveErrorLimit }}
      successCondition: result[0] <= {{ $a.maxErrorRatioDeltaVsStable }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: >-
            ((sum(rate(istio_requests_total{ {{- $canary -}} ,response_code=~"5.."}[{{ $w }}])) or vector(0))
            / clamp_min(sum(rate(istio_requests_total{ {{- $canary -}} }[{{ $w }}])) or vector(0), 1e-9))
            - ((sum(rate(istio_requests_total{ {{- $stable -}} ,response_code=~"5.."}[{{ $w }}])) or vector(0))
            / clamp_min(sum(rate(istio_requests_total{ {{- $stable -}} }[{{ $w }}])) or vector(0), 1e-9))
    - name: canary-p95-latency-ms
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      consecutiveErrorLimit: {{ $a.consecutiveErrorLimit }}
      successCondition: '!isNaN(result[0]) && result[0] <= {{ $a.maxP95LatencyMs }}'
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{ {{- $canary -}} }[{{ $w }}])))
    - name: canary-p95-latency-vs-stable-ms
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      consecutiveErrorLimit: {{ $a.consecutiveErrorLimit }}
      successCondition: '!isNaN(result[0]) && result[0] <= {{ $a.maxP95LatencyDeltaVsStableMs }}'
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: >-
            histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{ {{- $canary -}} }[{{ $w }}])))
            - histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{ {{- $stable -}} }[{{ $w }}])))
{{- end }}
