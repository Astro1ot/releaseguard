# ReleaseGuard pipeline for GitLab.
#   verify      unit/chart tests with JUnit + coverage, offline check of the LLM guard
#   regression  existing Compose drills: PostgreSQL, Redis, Kafka, edge, monitoring
#   kind        isolated kind stand: canary (Argo Rollouts + Istio + Prometheus), pod failure,
#               old-version/migration compatibility, Helm rollback rehearsal
#   review      optional advisory LLM review of the merge request (never blocks, never releases)
#   gate        deterministic release gate over the mandatory reports
#   release     image publication, only after the gate
# Docker-in-Docker jobs need a runner that allows privileged containers (GitLab.com Linux runners do).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [verify, regression, kind, review, gate, release]

variables:
  NODE_IMAGE: node:22-bookworm
  DOCKER_IMAGE: docker:28.3
  DIND_IMAGE: docker:28.3-dind

default:
  interruptible: true

.dind:
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
      command: [--tls=false]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - apk add --no-cache bash >/dev/null
  after_script:
    # Runs after a failure or timeout as well; the main script also collects on normal exit.
    - bash scripts/ci/dind-collect.sh || true

unit:
  stage: verify
  image: $NODE_IMAGE
  script:
    - npm ci --no-audit --no-fund
    - npm run test:ci
    - python3 scripts/ci/unittest_junit.py artifacts/junit/python.xml
    - apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null
    - python3 -m venv .venv && .venv/bin/pip install -q -r requirements-ansible.txt && .venv/bin/python tests/ansible_integration.py
    - python3 scripts/check_migrations.py
    - bash scripts/ci/install-tools.sh && export PATH="$PWD/.tools:$PATH"
    - helm lint charts/releaseguard --strict -f environments/local.yaml
    - helm lint charts/releaseguard --strict -f environments/kind-progressive.yaml
    - helm template releaseguard charts/releaseguard -f environments/staging.yaml > artifacts/rendered-staging.yaml
    - helm template releaseguard charts/releaseguard -n rg-canary -f environments/kind-progressive.yaml > artifacts/rendered-canary.yaml
    - if helm template releaseguard charts/releaseguard --set replicaCout=3 >/dev/null 2>&1; then echo 'Schema accepted a misspelled key'; exit 1; fi
    - node scripts/llm/eval.mjs
  coverage: '/all files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 30 days
    paths: [artifacts/]
    reports:
      junit: [artifacts/junit/node.xml, artifacts/junit/python.xml]

compose-regression:
  stage: regression
  extends: .dind
  needs: []
  timeout: 45m
  script:
    - bash scripts/ci/dind-run.sh "bash scripts/ci/compose-regression.sh"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [artifacts/]
    reports:
      junit: artifacts/junit-regression.xml

kind-scenarios:
  stage: kind
  extends: .dind
  needs: []
  timeout: 90m
  variables:
    GIT_DEPTH: '0'   # the migration compatibility scenario builds the previous version
  script:
    - export RG_BASE_REF="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$(git rev-parse HEAD~1)}"
    - echo "Previous application version for compatibility checks - $RG_BASE_REF"
    - bash scripts/ci/dind-run.sh "bash scripts/ci/install-tools.sh && bash scripts/kind/run-all.sh"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [artifacts/]
    reports:
      junit: artifacts/junit-scenarios.xml

# Optional. Enable with the CI/CD variable RG_LLM_REVIEW=true plus a masked ANTHROPIC_API_KEY.
# RG_GITLAB_TOKEN (project access token, Reporter role, api scope) lets it post the MR note.
llm-review:
  stage: review
  image: $NODE_IMAGE
  needs:
    - job: unit
    - job: compose-regression
      optional: true
    - job: kind-scenarios
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $RG_LLM_REVIEW == "true"
      when: always
  allow_failure: true
  interruptible: true
  timeout: 20m
  variables:
    GIT_DEPTH: '0'
  script:
    - npm ci --no-audit --no-fund
    - node scripts/llm/review.mjs
  artifacts:
    when: always
    expire_in: 30 days
    paths: [artifacts/llm-review/]

# Calls the model on the demo merge requests in examples/pr-review (costs API tokens).
llm-eval-live:
  stage: review
  image: $NODE_IMAGE
  needs: []
  rules:
    - if: $ANTHROPIC_API_KEY
      when: manual
  allow_failure: true
  script:
    - npm ci --no-audit --no-fund
    - node scripts/llm/eval.mjs --live
  artifacts:
    when: always
    paths: [artifacts/llm-eval/]

release-gate:
  stage: gate
  image: $NODE_IMAGE
  needs: [unit, compose-regression, kind-scenarios]   # llm-review is intentionally not an input
  script:
    - node scripts/ci/release_gate.mjs
  artifacts:
    when: always
    paths: [artifacts/release-gate.json]

release-image:
  stage: release
  extends: .dind
  needs: [release-gate]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  environment:
    name: image-registry
  after_script: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
