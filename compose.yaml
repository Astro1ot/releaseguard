name: releaseguard
x-app: &app
  build: .
  image: releaseguard:local
  init: true
  environment: &environment
    DATABASE_URL: postgres://releaseguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/releaseguard
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:9092
    APP_VERSION: ${APP_VERSION:-0.1.0-local}
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: releaseguard
      POSTGRES_USER: releaseguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U releaseguard -d releaseguard]
      interval: 3s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  migrate:
    <<: *app
    command: [node, dist/migrate.js]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    environment:
      <<: *environment
      RELEASE_FAULT: ${RELEASE_FAULT:-none}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  edge:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: [./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2d]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:9093:9093"]
    volumes: [./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  postgres-data:
